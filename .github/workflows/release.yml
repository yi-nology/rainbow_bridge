name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  preflight:
    name: Validate release inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check notes, configuration and maintenance tools
        shell: bash
        run: |
          set -euo pipefail
          test -s "docs/releases/${GITHUB_REF_NAME}.md"
          for file in deploy/release/config.yaml deploy/release/QUICKSTART.md cmd/release-storage/README.md; do
            test -s "$file"
          done
          for tool in admin-password-reset backup-restore release-storage; do
            test -s "cmd/$tool/main.go"
          done

  build-binaries:
    needs: [preflight]
    uses: ./.github/workflows/build-binaries.yml
    with:
      base_path: "/rainbow-bridge"

  build-docker-from-remote-bin:
    needs: [build-binaries, release]
    uses: ./.github/workflows/build-docker-remote-bin.yml
    secrets: inherit
    with:
      base_path: "/rainbow-bridge"
      version: ${{ github.ref_name }}
      git_commit: ${{ github.sha }}
      build_time: ${{ github.event.head_commit.timestamp }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-binaries]
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: List all artifacts
        run: find dist -type f

      - name: Generate download checksums
        run: |
          set -eu
          mkdir -p release-assets
          find dist -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec cp {} release-assets/ \;
          for asset in frontend.zip frontend.tar.gz rainbow_bridge-app-linux-amd64.tar.gz rainbow_bridge-app-linux-arm64.tar.gz rainbow_bridge-app-darwin-amd64.tar.gz rainbow_bridge-app-darwin-arm64.tar.gz rainbow_bridge-app-windows-amd64.zip; do
            test -s "release-assets/$asset"
          done
          cp docs/releases/${GITHUB_REF_NAME}.md release-assets/RELEASE_NOTES.md
          cp deploy/release/QUICKSTART.md release-assets/QUICKSTART.md
          cd release-assets
          sha256sum *.zip *.tar.gz *.md > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: docs/releases/${{ github.ref_name }}.md
          fail_on_unmatched_files: true
          files: |
            release-assets/*
