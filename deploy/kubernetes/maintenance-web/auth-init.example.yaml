# Explicit once-per-instance deployment window. Source Deployment must be stopped,
# its dedicated login role NOLOGIN, and all its sessions absent before this Job.
apiVersion: batch/v1
kind: Job
metadata: {name: maintenance-auth-init, namespace: REPLACE_NAMESPACE}
spec:
  backoffLimit: 0
  parallelism: 1
  completions: 1
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001}
      containers:
        - name: migrate
          image: REPLACE_IMAGE_AT_SHA256_DIGEST
          command: [/app/maintenance-console]
          args: [--config, /console/console.yaml, --initialize, --source-config, /source/config.yaml]
          env:
            - name: RB_AUTH_INIT_DSN
              valueFrom: {secretKeyRef: {name: auth-init-credentials, key: control_dsn}}
            - name: RB_AUTH_SOURCE_ROLE
              valueFrom: {secretKeyRef: {name: auth-init-credentials, key: source_role}}
          volumeMounts:
            - {name: console, mountPath: /console, readOnly: true}
            - {name: source, mountPath: /source, readOnly: true}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: '1', memory: 512Mi}}
      volumes:
        - {name: console, secret: {secretName: console-config, defaultMode: 0440}}
        - {name: source, secret: {secretName: auth-source-read-config, defaultMode: 0440}}
