apiVersion: v1
kind: ServiceAccount
metadata: {name: maintenance-executor, namespace: REPLACE_NAMESPACE}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: maintenance-executor, namespace: REPLACE_NAMESPACE}
rules:
  - apiGroups: ['']
    resources: [pods, pods/proxy]
    verbs: [get, list, watch]
  - apiGroups: ['']
    resources: [secrets]
    verbs: [get, create, update]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, update]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: maintenance-executor, namespace: REPLACE_NAMESPACE}
subjects:
  - {kind: ServiceAccount, name: maintenance-executor, namespace: REPLACE_NAMESPACE}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: maintenance-executor}
